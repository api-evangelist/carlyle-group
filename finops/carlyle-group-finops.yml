meters:
  - name: portal_users
    unit: seat-month
    aggregation: max
    dimensions:
      - portal
      - relationship
  - name: management_fees
    unit: USD
    aggregation: sum
    dimensions:
      - fund
  - name: performance_fees
    unit: USD
    aggregation: sum
    dimensions:
      - fund
principles:
  - name: Visibility
    description: Visibility comes from fund reporting (capital account statements, K-1s, quarterly letters)
      rather than API usage telemetry.
  - name: Allocation
    description: Allocate by fund and vintage; LP-side cost attribution is by capital commitment.
  - name: Optimization
    description: Optimization is at the LP-portfolio level (fee negotiation, co-invest participation)
      rather than at API-call level.
  - name: Accountability
    description: LP relationship manager / portfolio operations team owns the relationship; quarterly
      LP advisory committee reviews are typical.
