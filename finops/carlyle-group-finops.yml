description: 'FOCUS-aligned FinOps for The Carlyle Group: institutional asset management with no public
  API billing surface; portal access is bundled with the LP/portfolio-company relationship.'
notes: Carlyle does not bill API or portal access as a metered service. FinOps mapping is included for
  consistency; treat as informational rather than reconcilable.
sources:
  - https://www.carlyle.com/
