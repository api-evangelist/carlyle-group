description: The Carlyle Group does not publish a public developer API or developer portal. Investor
  and partner access (LP Connect, Direct Lending portal, Global Portfolio Solutions) is gated by relationship
  rather than commercial subscription. Integrations with fund administrators, custodians, and placement
  agents run through bespoke secure file exchange and vendor-managed APIs.
notes: No public API pricing exists. Carlyle is a closed institutional asset manager; LP, co-investor,
  and portfolio-company relationships are bilateral.
